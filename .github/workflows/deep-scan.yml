name: Advance deep scan

# Plan-independent scheduler for the Sena deep-scan job. GitHub Actions runs
# this on a fixed interval and pings the deployed endpoint, which advances any
# in-flight job by one chunk and no-ops (skipped:true) once the job is done.
# This is an alternative to the Vercel cron in web/vercel.json — useful when
# the Vercel project is on a plan that throttles sub-daily crons.

on:
  schedule:
    # every 10 minutes (GitHub may delay under load; 5 min is the floor)
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

# Don't pile up overlapping runs — the endpoint also self-locks, but this keeps
# the Actions queue clean.
concurrency:
  group: deep-scan
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - name: Advance one chunk
        run: |
          URL="${DEEP_SCAN_URL:-https://sena-marketmosaic.vercel.app/api/run-deep}"
          echo "Pinging $URL"
          # follow redirects, 50s cap (route maxDuration is 60s), show the JSON body
          code=$(curl -sS -L --max-time 55 -o /tmp/resp.json -w "%{http_code}" "$URL" || echo "000")
          echo "HTTP $code"
          cat /tmp/resp.json || true
          echo
          # Treat network/timeout (000) and 5xx as soft failures so the schedule
          # keeps retrying on the next tick rather than going red permanently.
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "::warning::deep-scan ping did not succeed (HTTP $code) — will retry next tick"
          fi
    env:
      # Override in repo settings → Variables if the production URL changes.
      DEEP_SCAN_URL: ${{ vars.DEEP_SCAN_URL }}
