name: Deploy Sena Web to Vercel

on:
  push:
    branches: [main, "claude/nifty-newton-KOvRC"]
    paths: ["web/**"]
  workflow_dispatch:

# Cancel any in-progress deploy when a new one is triggered
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Vercel CLI
        run: npm install -g vercel@54.9.1

      - name: Build (local)
        run: vercel build --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        timeout-minutes: 8
        run: |
          # Vercel intermittently returns "deployment failed, retry later".
          # Retry a few times with backoff before giving up.
          set +e
          for attempt in 1 2 3 4; do
            echo "Deploy attempt $attempt…"
            URL=$(vercel deploy --prebuilt --prod --yes --no-wait \
              --token=${{ secrets.VERCEL_TOKEN }})
            STATUS=$?
            if [ $STATUS -eq 0 ] && [ -n "$URL" ]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "Deployed → $URL"
              exit 0
            fi
            echo "Attempt $attempt failed (exit $STATUS). Backing off…"
            sleep $((attempt * 15))
          done
          echo "All deploy attempts failed." >&2
          exit 1
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Set env vars on Vercel project
        timeout-minutes: 2
        working-directory: web
        run: |
          for VAR in BEEHIIV_API_KEY BLOB_READ_WRITE_TOKEN SENA_BLOB_READ_WRITE_TOKEN; do
            vercel env rm $VAR production --yes --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || true
          done
          echo "${{ secrets.BEEHIIV_API_KEY }}" | \
            vercel env add BEEHIIV_API_KEY production --token=${{ secrets.VERCEL_TOKEN }}
          echo "${{ secrets.SENA_BLOB_READ_WRITE_TOKEN }}" | \
            vercel env add SENA_BLOB_READ_WRITE_TOKEN production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Summary
        run: echo "### Deployed to ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
