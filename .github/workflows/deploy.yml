name: Deploy Sena Web to Vercel

on:
  push:
    branches: [main, "claude/nifty-newton-KOvRC"]
    paths: ["web/**"]
  workflow_dispatch:

# Cancel any in-progress deploy when a new one is triggered
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Vercel CLI
        run: npm install -g vercel@54.9.1

      - name: Cancel stuck Vercel deployments
        run: |
          TOKEN="${{ secrets.VERCEL_TOKEN }}"
          # Cancel any deployments in BUILDING or QUEUED state
          for STATE in BUILDING QUEUED; do
            UIDS=$(curl -sf "https://api.vercel.com/v6/deployments?app=sena-pipeline&state=$STATE&limit=20" \
              -H "Authorization: Bearer $TOKEN" | jq -r '.deployments[]?.uid // empty' 2>/dev/null || true)
            for UID in $UIDS; do
              echo "Cancelling $UID ($STATE)"
              curl -sf -X PATCH "https://api.vercel.com/v12/deployments/$UID/cancel" \
                -H "Authorization: Bearer $TOKEN" || true
            done
          done
          echo "Pre-deploy cleanup done"

      - name: Deploy to Vercel
        id: deploy
        timeout-minutes: 8
        run: |
          URL=$(vercel deploy --prod --yes \
            --name sena-pipeline \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed → $URL"
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Set env vars on Vercel project
        timeout-minutes: 2
        working-directory: web
        run: |
          for VAR in BEEHIIV_API_KEY BLOB_READ_WRITE_TOKEN SENA_BLOB_READ_WRITE_TOKEN; do
            vercel env rm $VAR production --yes --token=${{ secrets.VERCEL_TOKEN }} 2>/dev/null || true
          done
          echo "${{ secrets.BEEHIIV_API_KEY }}" | \
            vercel env add BEEHIIV_API_KEY production --token=${{ secrets.VERCEL_TOKEN }}
          echo "${{ secrets.SENA_BLOB_READ_WRITE_TOKEN }}" | \
            vercel env add SENA_BLOB_READ_WRITE_TOKEN production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Summary
        run: echo "### Deployed to ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
